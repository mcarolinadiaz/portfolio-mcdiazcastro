<article class="card column">
    <header class="card-header">
        <div class="card-title">{{ experience.position | translate }} - {{ experience.company }}</div>
        <div class="card-subtitle">
            @if (!isTeachingAssistant) {
                {{ getDateToString(experience.startDate, experience.endDate) }}
            } @else {
                <app-list-group [listItems]="getListGroupItems(experience.dates)"></app-list-group>
            }
        </div>
    </header>
    <div class="card-body">
        <p class="card-text">{{ experience.description | translate }}</p>
    </div>
    @if (!isTeachingAssistant) {
        <footer class="card-footer">
            <app-list-group [listItems]="experience.stack"></app-list-group>
        </footer>
    }
</article>
