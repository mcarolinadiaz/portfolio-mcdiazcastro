<section class="contact" aria-labelledby="contact-title">
  <div class="contact-intro">
    <p class="eyebrow">{{ navKey | translate }}</p>
    <h1 id="contact-title" class="contact-title">{{ 'CONTACT.TITLE' | translate }}</h1>
    <p class="contact-subtitle">{{ 'CONTACT.SUBTITLE' | translate }}</p>
    <dl class="contact-details">
      <dt>{{ 'ABOUT.FACTS.LOCATION' | translate }}</dt>
      <dd>{{ contactInformation.location }}</dd>
      <dt>{{ 'ABOUT.FACTS.WORK_AUTHORIZATION' | translate }}</dt>
      <dd>{{ contactInformation.workAuthorization }}</dd>
    </dl>
  </div>
  <app-social-links class="contact-links" variant="cards"></app-social-links>
</section>
