<div class="center-page-container">
    <div [ngClass]="{ 'center-page-information': isImageLoading(), 'center-page-information-no-image': !isImageLoading() }">
        <ng-content />
    </div>
    @if (isImageLoading()) {
        <div class="center-page-image">
            <img class="center-page-image-img" 
                [src]="image()" 
                [alt]="imageName()" 
                >
        </div>
    }
</div>
