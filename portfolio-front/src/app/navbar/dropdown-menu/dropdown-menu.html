@if (responsiveService.isMobile()) {
  <button
    class="menu-toggle"
    type="button"
    [attr.aria-expanded]="isMenuOpen()"
    [attr.aria-controls]="menuId"
    [attr.aria-label]="(isMenuOpen() ? 'NAV.CLOSE_MENU' : 'NAV.OPEN_MENU') | translate"
    (click)="toggleMenu()"
  >
    @if (isMenuOpen()) {
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M6 6l12 12M18 6L6 18"></path>
      </svg>
    } @else {
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M4 7h16M4 12h16M4 17h16"></path>
      </svg>
    }
  </button>

  @if (isMenuOpen()) {
    <div class="mobile-menu" [id]="menuId">
      <ul class="menu-list mobile-menu-list">
        @for (route of appRoutes; track route.path) {
          <li>
            <a
              class="menu-link"
              [routerLink]="'/' + route.path"
              routerLinkActive="active"
              ariaCurrentWhenActive="page"
              [routerLinkActiveOptions]="{ exact: true }"
              (click)="closeMenu()"
              >{{ route.title | translate }}</a
            >
          </li>
        }
      </ul>
      <app-language-selector></app-language-selector>
    </div>
  }
} @else {
  <div class="desktop-menu">
    <ul class="menu-list desktop-menu-list">
      @for (route of appRoutes; track route.path) {
        <li>
          <a
            class="menu-link"
            [routerLink]="'/' + route.path"
            routerLinkActive="active"
            ariaCurrentWhenActive="page"
            [routerLinkActiveOptions]="{ exact: true }"
            >{{ route.title | translate }}</a
          >
        </li>
      }
    </ul>
    <app-language-selector></app-language-selector>
  </div>
}
