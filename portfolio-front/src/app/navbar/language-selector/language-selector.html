<div class="language-selector" role="group" [attr.aria-label]="'LANGUAGE.SELECTOR' | translate">
  <button
    class="language-button"
    type="button"
    [class.active]="languageService.activeLanguage() === language.ENGLISH"
    [attr.aria-pressed]="languageService.activeLanguage() === language.ENGLISH"
    (click)="setLanguage(language.ENGLISH)"
  >
    {{ 'NAV.EN' | translate }}
  </button>
  <button
    class="language-button"
    type="button"
    [class.active]="languageService.activeLanguage() === language.SPANISH"
    [attr.aria-pressed]="languageService.activeLanguage() === language.SPANISH"
    (click)="setLanguage(language.SPANISH)"
  >
    {{ 'NAV.SP' | translate }}
  </button>
</div>
