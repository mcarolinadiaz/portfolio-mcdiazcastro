<div class="app-container">
    <button type="button" class="skip-link" (click)="focusMainContent()">
        {{ 'NAV.SKIP_TO_CONTENT' | translate }}
    </button>
    <header class="app-header">
        <div class="app-section-inner">
            <app-navbar></app-navbar>
        </div>
    </header>
    <!-- Focusable because it is the scroll container: keyboard users can scroll it with the arrows. -->
    <main #pageContainer class="page-container" tabindex="0">
        <div class="page-content">
            <router-outlet></router-outlet>
        </div>
    </main>
    <div class="app-footer">
        <div class="app-section-inner">
            <app-footer></app-footer>
        </div>
    </div>
</div>
