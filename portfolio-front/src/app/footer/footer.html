<footer class="footer">
    <div class="footer-text">
        Designed by myself and coded in Visual Studio Code with Angular v22, Bootstrap v5, and SCSS. 
    </div>
    <div class="footer-content">
        @for (network of professionalNetworks; track network) {
            <a [href]="network.url" target="_blank">
                <img class="icon-img" [src]="network.icon" [alt]="network.name">
            </a>
        }
    </div>
</footer>
