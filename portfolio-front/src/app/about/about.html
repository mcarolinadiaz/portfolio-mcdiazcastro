<div>
    <div>
        Nombre completo: {{ user.name }} ({{ user.nickname }})
    </div>
    <div>
        {{ user.degree }}
    </div>
    <div>
        {{ user.about }}
    </div>
    <div>
        <div>Redes profesionales</div>
        <div>
            @for (network of user.professionalNetworks; track network) {
                <a [href]="network.url" target="_blank">
                    <img [src]="network.icon" [alt]="network.name" width="24" height="24">
                </a>
            }
        </div>
    </div>
</div>
