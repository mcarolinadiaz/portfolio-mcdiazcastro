<div class="center-page-container">
    <div
        [class.center-page-information]="hasImage()"
        [class.center-page-information-no-image]="!hasImage()"
    >
        <ng-content />
    </div>
    @if (hasImage()) {
        <div class="center-page-image">
            <img class="center-page-image-img" 
                [src]="image()" 
                [alt]="imageName()" 
                >
        </div>
    }
</div>
