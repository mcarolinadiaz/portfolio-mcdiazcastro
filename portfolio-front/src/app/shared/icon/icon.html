<svg
  aria-hidden="true"
  focusable="false"
  [attr.width]="size()"
  [attr.height]="size()"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  @for (path of paths(); track $index) {
    <path [attr.d]="path" />
  }
</svg>
